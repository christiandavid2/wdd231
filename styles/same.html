<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Listing</title>
    <style>
        .business-card {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            padding: 20px;
            width: 300px;
            font-family: Arial, sans-serif;
        }
        .business-card img {
            width: 80px;
            height: 80px;
            margin-right: 20px;
        }
        .business-info {
            display: flex;
            flex-direction: column;
        }
        .business-info h1, .business-info h2 {
            margin: 0;
        }
        .business-info p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="business-card">
        <img src="your-image-url.jpg" alt="Business Logo">
        <div class="business-info">
            <h1>Business Name</h1>
            <h2>Business Tag Line</h2>
            <p>Email: info@gmail.com</p>
            <p>Phone: 800-555-1234</p>
            <p>URL: mybusiness.com</p>
        </div>
    </div>
</body>
</html>
